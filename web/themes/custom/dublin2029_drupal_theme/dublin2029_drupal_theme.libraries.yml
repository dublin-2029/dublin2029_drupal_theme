fonts:
  version: VERSION
  css:
    base:
      css/base/fonts.css: {}
  dependencies:
    # Guarantees load order: fonts.css's --rt-font-* overrides must load
    # AFTER registration_theme/tokens' own :root defaults for those same
    # custom properties, or the later-loading one wins the cascade
    # regardless of which is "correct". Computed CSS weight alone doesn't
    # reliably guarantee this (fonts.css was actually being computed with
    # a *lower* weight than tokens.css, loading it first and effectively
    # overriding its own override) - an explicit dependency is a hard
    # guarantee, not a tie-breaker.
    - registration_theme/tokens
header:
  version: VERSION
  css:
    component:
      css/components/header.css: {}
      css/components/site-nav.css: {}
  js:
    js/sticky-header.js: {}
  dependencies:
    - core/drupal
hero:
  version: VERSION
  css:
    component:
      css/components/hero.css: {}
footer:
  version: VERSION
  css:
    component:
      css/components/footer.css: {}
buttons:
  version: VERSION
  css:
    component:
      css/components/button-colors.css: {}
member-type-card-icon:
  version: VERSION
  css:
    component:
      css/components/member-type-card-icon.css: {}
content-tables-extra:
  version: VERSION
  css:
    component:
      css/components/content-tables-extra.css: {}
  dependencies:
    # Same load-order guarantee as the `fonts` library above: must load
    # after registration_theme/content-tables, the shared rule this
    # overrides, regardless of computed weight.
    - registration_theme/content-tables
